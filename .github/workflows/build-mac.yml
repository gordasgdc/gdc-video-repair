name: Build GDC Video Repair (Mac .app + .pkg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build .app with PyInstaller
        run: |
          pyinstaller build/build-mac.spec --noconfirm

      - name: Zip the .app for distribution
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GDCVideoRepair.app GDCVideoRepair-mac.zip
          cd ..

      - name: Create .pkg installer
        run: |
          mkdir -p pkg_root/Applications
          cp -R dist/GDCVideoRepair.app pkg_root/Applications/
          pkgbuild \
            --root pkg_root \
            --identifier com.gordasgdc.videorepair \
            --version "${VERSION:-1.0.0}" \
            --install-location /Applications \
            GDCVideoRepair.pkg

      # Builds the unified, single-download release archive:
      # GDCVideoRepair-macos.zip
      # ├── GDCVideoRepair.pkg
      # ├── guides/*.pdf
      # └── README.txt
      - name: Package release archive
        run: |
          mkdir -p release/macos/guides
          cp GDCVideoRepair.pkg release/macos/
          cp docs/guides/*.pdf release/macos/guides/
          cat > release/macos/README.txt << EOF
          GDC Video Repair v${VERSION} — macOS
          =====================================

          INSTALARE
          1. Dublu-click pe GDCVideoRepair.pkg
          2. Urmeaza instalatorul standard macOS
          3. Aplicatia necesita FFmpeg instalat separat:
             brew install ffmpeg

          GHIDURI
          Gasesti ghidul complet de utilizare (instalare, cum functioneaza,
          exemple, depanare) in folderul guides/, in romana, engleza si spaniola.

          Cod sursa si documentatie: https://github.com/gordasgdc/gdc-video-repair
          Licenta: MIT
          EOF
          cd release/macos
          zip -r "../../GDCVideoRepair-macos.zip" .
          cd ../..

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDCVideoRepair-Mac
          path: |
            dist/GDCVideoRepair-mac.zip
            GDCVideoRepair-macos.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GDCVideoRepair-macos.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
