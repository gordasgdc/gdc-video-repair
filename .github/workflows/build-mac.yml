name: Build GDC Video Repair (Mac .app + .pkg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build .app with PyInstaller
        run: |
          pyinstaller build/build-mac.spec --noconfirm

      - name: Zip the .app for distribution
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GDCVideoRepair.app GDCVideoRepair-mac.zip
          cd ..

      - name: Create .pkg installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg_root/Applications
          cp -R dist/GDCVideoRepair.app pkg_root/Applications/
          pkgbuild \
            --root pkg_root \
            --identifier com.gordasgdc.videorepair \
            --version "${VERSION:-1.0.0}" \
            --install-location /Applications \
            GDCVideoRepair.pkg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GDCVideoRepair-Mac
          path: |
            dist/GDCVideoRepair-mac.zip
            GDCVideoRepair.pkg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GDCVideoRepair-mac.zip
            GDCVideoRepair.pkg
            docs/guides/*.pdf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
